<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Haiku Cosmos</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr;
    }

    #gameCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
    }

    #uiRoot {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #topBar {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
      z-index: 9998;
    }

    .pill {
      pointer-events: auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      backdrop-filter: blur(8px);
    }

    button.pill {
      cursor: pointer;
    }

    #fpsLabel {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="uiRoot">
    <div id="topBar">
      <div class="pill" id="fpsLabel">FPS: --</div>
      <button class="pill" id="btnRestart" type="button">Restart</button>
      <button class="pill" id="btnSubMeta" type="button">META</button>
    </div>
  </div>

  <!-- Source of truth documentation is in /md (see md/README.md). -->

  <script src="./cards.js"></script>

  <script src="./hc.core.js"></script>
  <script src="./hc.util.js"></script>
  <script src="./hc.world.js"></script>
  <script src="./hc.view_input.js"></script>
  <script src="./hc.camera.js"></script>
  <script src="./hc.comets.js"></script>
  <script src="./hc.meteors.js"></script>
  <script src="./hc.render.js"></script>
  <script src="./hc.collisions.js"></script>
  <script src="./hc.asteroids.js"></script>
  <script src="./hc.planets.js"></script>
  <script src="./hc.stars_epoch.js"></script>
  <script src="./hc.ui_debug.js"></script>

  <script src="./game.boot.js"></script>

  <noscript>
    <div style="color:#fff; padding:16px; font-family:system-ui;">
      Ta gra wymaga włączonego JavaScript.
    </div>
  </noscript>
</body>
</html>
