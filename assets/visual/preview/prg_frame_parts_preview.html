  <style>
    :root { --bg:#111827; --fg:#e5e7eb; --panel:#1f2937; --muted:#9ca3af; --accent:#34d399; }
    body.light { --bg:#f3f4f6; --fg:#111827; --panel:#ffffff; --muted:#6b7280; --accent:#059669; }
    body { margin:0; font-family:Inter,system-ui,Arial,sans-serif; background:var(--bg); color:var(--fg); }
    .wrap { max-width: 1400px; margin:0 auto; padding:20px; }
    h1,h2,h3 { margin:0 0 10px; }
    .panel { background:var(--panel); border:1px solid #374151; border-radius:10px; padding:14px; margin-bottom:16px; }
    .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
    .kv { font-size:14px; } .kv b { color:var(--accent); }
    .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
    .controls label { font-size:14px; cursor:pointer; }
    .asset-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:12px; }
    .asset-card { border:1px solid #4b5563; border-radius:8px; padding:10px; }
    .meta { font-size:12px; color:var(--muted); line-height:1.35; margin-bottom:8px; }
    .thumb-wrap { position:relative; background:#0b1020; border:1px solid #4b5563; border-radius:6px; height:200px; overflow:hidden; }
    .thumb-wrap img, .thumb-wrap svg { position:absolute; inset:0; width:100%; height:100%; }
    .thumb-wrap img { object-fit:contain; }
    .overlay text { font-size:6px; fill:#f9fafb; paint-order:stroke; stroke:#000; stroke-width:0.8; }
    .pivot { fill:#ef4444; } .join { fill:#3b82f6; }
    .bounds { fill:none; stroke:#94a3b8; stroke-width:0.8; stroke-dasharray:2 2; }
    .assembly-wrap { position:relative; height:680px; background:#0b1020; border:1px solid #4b5563; border-radius:8px; overflow:hidden; }
    .assembly-wrap img, .assembly-wrap svg { position:absolute; }
    .diag li { margin-bottom:6px; }
    .hidden { display:none !important; }
    .badge { display:inline-block; padding:4px 8px; background:#065f46; color:#d1fae5; border-radius:999px; font-size:12px; }
  </style>
</head>

      "file": "center.svg",
      "type": "frame_part",
      "status": "static_base",
      "sourceCutRect": {
        "x": 94.838982,
        "y": 40.930695,
        "w": 111.43444,
        "h": 306.89978,
        "name": "center"
      },
      "viewBox": "0 0 111.4344 306.8998",
      "anchorType": "center",
      "anchorPoint": {
        "x": 55.5776,
        "y": 153.665
      },
      "anchorOffset": {
        "x": -0.1396,
        "y": 0.2151
      },
      "stretchAxis": "none",
      "anchors": {
        "pivot": {
          "x": 55.5776,
          "y": 153.665
        },
        "join_u": {
          "x": 55.5776,
          "y": -0.0235,
          "sourceName": "fill-center-u"
        },
        "join_l": {
          "x": 0.0,
          "y": 153.665,
          "sourceName": "fill-center-l"
        },
        "join_r": {
          "x": 111.4268,
          "y": 153.6671,
          "sourceName": "fill-center-r"
        },
        "join_d": {
          "x": 55.5776,
          "y": 306.8998,
          "sourceName": "fill-center-d"
        }
      },
      "warnings": [
        "Center pivot via inside-rect fallback"
      ],
      "expectedJoinAnchors": 4
    }
  ]
}
`);

    const expectedByType = {
      ornament: 4,
      center_fill: 5,
      line: 3,
      corner: 3
    };

    const ids = {
      showBounds: document.getElementById('showBounds'),
      showPivots: document.getElementById('showPivots'),
      showJoins: document.getElementById('showJoins'),
      showLabels: document.getElementById('showLabels'),
      lightBg: document.getElementById('lightBg'),
      toggleAssembly: document.getElementById('toggleAssembly'),
      toggleGrid: document.getElementById('toggleGrid')
    };

    function setHeader() {
      const el = document.getElementById('header');
      el.innerHTML = `
        <h1>Haiku Cosmos — PRG Frame Parts Preview</h1>
        <div class="summary-grid">
          <div class="kv"><b>sourceFile:</b> ${manifest.sourceFile}</div>
          <div class="kv"><b>assetCount:</b> ${manifest.assetCount}</div>
          <div class="kv"><b>extractionMode:</b> ${manifest.extractionMode}</div>
          <div class="kv"><b>anchorMatchingPolicy:</b> ${manifest.anchorMatchingPolicy}</div>
          <div class="kv"><b>Status:</b> <span class="badge">PRG frame extraction: PASS / REVIEW READY</span></div>
        </div>`;
    }

    function parseViewBox(vb) {
      const [x,y,w,h] = vb.split(/\s+/).map(Number); return {x,y,w,h};
    }

    function overlay(asset, w=100, h=100) {
      const vb = parseViewBox(asset.viewBox);
      const scale = Math.min(w / vb.w, h / vb.h);
      const ox = (w - vb.w * scale) / 2;
      const oy = (h - vb.h * scale) / 2;
      const tx = v => ox + (v - vb.x) * scale;
      const ty = v => oy + (v - vb.y) * scale;

      const pivot = asset.anchorPoint || {x: vb.x + vb.w/2, y: vb.y + vb.h/2};
      const joins = (asset.anchors || []).filter(a => a.kind === 'join');
      const labels = [];

      const parts = [`<svg class="overlay" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">`];
      parts.push(`<rect class="bounds ${ids.showBounds.checked ? '' : 'hidden'}" x="${tx(vb.x)}" y="${ty(vb.y)}" width="${vb.w*scale}" height="${vb.h*scale}"/>`);
      parts.push(`<circle class="pivot ${ids.showPivots.checked ? '' : 'hidden'}" cx="${tx(pivot.x)}" cy="${ty(pivot.y)}" r="2.6"/>`);
      if (ids.showLabels.checked) labels.push(`<text x="${tx(pivot.x)+3}" y="${ty(pivot.y)-3}">pivot${asset.anchorType ? ' ('+asset.anchorType+')' : ''}</text>`);
      joins.forEach(j => {
        parts.push(`<circle class="join ${ids.showJoins.checked ? '' : 'hidden'}" cx="${tx(j.x)}" cy="${ty(j.y)}" r="2"/>`);
        if (ids.showLabels.checked) labels.push(`<text x="${tx(j.x)+2}" y="${ty(j.y)-2}">${j.id}${j.sourceName ? ' · ' + j.sourceName : ''}</text>`);
      });
      parts.push(...labels);
      parts.push('</svg>');
      return parts.join('');
    }

    function buildGrid() {
      const grid = document.getElementById('assetGrid');
      grid.innerHTML = '';
      manifest.assets.forEach(asset => {
        const warn = (asset.warnings || []).join(', ') || 'none';
        const joins = (asset.anchors || []).filter(a => a.kind === 'join').length;
        const card = document.createElement('article');
        card.className = 'asset-card';
        card.innerHTML = `
          <h3>${asset.logicalName}</h3>
          <div class="meta">
            file: ${asset.file}<br>
            type: ${asset.type}<br>
            stretchAxis: ${asset.stretchAxis || 'none'}<br>
            anchor count: ${(asset.anchors||[]).length} (join: ${joins})<br>
            warnings: ${warn}
          </div>
          <div class="thumb-wrap">
            <img src="../prg/svg/frame_parts/${asset.file}" alt="${asset.logicalName}" />
            ${overlay(asset)}
          </div>`;
        grid.appendChild(card);
      });
    }

    function buildAssembly() {
      const stage = document.getElementById('assembly');
      stage.innerHTML = '';
      const rects = manifest.assets.map(a => a.sourceCutRect);
      const minX = Math.min(...rects.map(r=>r.x));
      const minY = Math.min(...rects.map(r=>r.y));
      const maxX = Math.max(...rects.map(r=>r.x+r.width));
      const maxY = Math.max(...rects.map(r=>r.y+r.height));
      const W = maxX - minX, H = maxY - minY;
      const sw = stage.clientWidth, sh = stage.clientHeight;
      const s = Math.min((sw-40)/W, (sh-40)/H);
      const ox = (sw - W*s)/2, oy = (sh - H*s)/2;

      manifest.assets.forEach(asset => {
        const r = asset.sourceCutRect;
        const img = document.createElement('img');
        img.src = `../prg/svg/frame_parts/${asset.file}`;
        img.style.left = `${ox + (r.x-minX)*s}px`;
        img.style.top = `${oy + (r.y-minY)*s}px`;
        img.style.width = `${r.width*s}px`;
        img.style.height = `${r.height*s}px`;
        stage.appendChild(img);

        const ov = document.createElement('div');
        ov.style.left = img.style.left; ov.style.top = img.style.top;
        ov.style.width = img.style.width; ov.style.height = img.style.height;
        ov.style.position = 'absolute';
        ov.innerHTML = overlay(asset, r.width, r.height);
        const svg = ov.firstElementChild;
        svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
        stage.appendChild(ov);
      });
    }

    function diagnostics() {
      const list = document.getElementById('diagnostics');
      const manifestWarnings = manifest.warnings || [];
      const unmatched = manifest.unmatchedAnchors || [];
      const rejected = manifest.rejectedAnchors || [];
      const out = [];
      out.push(`Manifest warnings: ${manifestWarnings.length ? manifestWarnings.join(' | ') : 'none'}`);
      out.push(`Unmatched anchors: ${unmatched.length ? JSON.stringify(unmatched) : 'none'}`);
      out.push(`Rejected anchors: ${rejected.length ? JSON.stringify(rejected) : 'none'}`);
      out.push('Center pivot fallback: Center pivot via inside-rect fallback (informational, non-blocking).');
      manifest.assets.forEach(a => {
        const expected = expectedByType[a.type] ?? (a.logicalName === 'center' ? 5 : null);
        const actual = (a.anchors || []).length;
        out.push(`${a.logicalName}: expected anchors ${expected ?? 'n/a'}, actual ${actual} ${expected===actual ? '✅' : '⚠️'}`);
      });
      list.innerHTML = out.map(x => `<li>${x}</li>`).join('');
    }

    function renderAll() {
      document.body.classList.toggle('light', ids.lightBg.checked);
      document.getElementById('assemblySection').classList.toggle('hidden', !ids.toggleAssembly.checked);
      document.getElementById('gridSection').classList.toggle('hidden', !ids.toggleGrid.checked);
      setHeader(); buildGrid(); buildAssembly(); diagnostics();
    }

    Object.values(ids).forEach(i => i.addEventListener('change', renderAll));
    window.addEventListener('resize', buildAssembly);
    renderAll();
  </script>
</body>
</html>
