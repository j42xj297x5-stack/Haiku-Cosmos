<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SUB-META v2 Composition v0.4 Preview</title>
  <link rel="stylesheet" href="submeta_v2_wireframe.css" />
</head>
<body>
  <header class="toolbar">
    <h1>SUB-META v2 — Composition v0.4 (content-driven cockpit)</h1>
    <div class="mode-switch" role="group" aria-label="Tryb widoku">
      <button data-mode="desktop" class="is-active">Desktop</button>
      <button data-mode="tablet">Tablet</button>
      <button data-mode="mobile">Mobile</button>
    </div>
  </header>

  <main id="wireframeRoot" class="mode-desktop">
    <section class="legend panel">
      <h2>Composition v0.4 legend</h2>
      <ul>
        <li><span class="swatch card"></span> vertical card placeholder (R1/R2/R3/R4/DS/EXT/ODB)</li>
        <li><span class="swatch core"></span> resonance core geometry + central R4</li>
        <li><span class="swatch connector"></span> mini connectors / unlockable future nodes</li>
        <li><span class="swatch wing"></span> PRG (vertical) vs ŚWIAT (horizontal character)</li>
      </ul>
    </section>

    <section class="cockpit panel" id="cockpitLayout"></section>
    <section class="mobile-workspace panel" id="mobileWorkspace"></section>
  </main>

  <script src="submeta_v2_wireframe.js"></script>
</body>
</html>
