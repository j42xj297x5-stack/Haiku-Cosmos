<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SUB-META v2 Composition v0.5 Preview</title>
  <link rel="stylesheet" href="submeta_v2_wireframe.css" />
</head>
<body>
  <header class="toolbar">
    <h1>SUB-META v2 Composition v0.5 — anchor-aware concept pass</h1>
    <div class="mode-switch" role="group" aria-label="Tryb widoku">
      <button data-mode="desktop" class="is-active">Desktop</button>
      <button data-mode="tablet">Tablet</button>
      <button data-mode="mobile">Mobile</button>
    </div>
  </header>

  <main id="wireframeRoot" class="mode-desktop">
    <section class="legend panel">
      <h2>Composition v0.5 legend</h2>
      <ul>
        <li><span class="swatch card"></span> vertical card placeholder (R1/R2/R3/R4/EXT/ODB/DS)</li>
        <li><span class="swatch core"></span> resonance geometry (R4 center + orbit R3)</li>
        <li><span class="swatch anchor"></span> named anchors / mount center guides</li>
        <li><span class="swatch wing"></span> PRG ↔ ŚWIAT wing symmetry (semantic 9-zone map)</li>
      </ul>
    </section>

    <section class="cockpit panel" id="cockpitLayout"></section>
    <section class="mobile-workspace panel" id="mobileWorkspace"></section>
  </main>

  <script src="submeta_v2_wireframe.js"></script>
</body>
</html>
