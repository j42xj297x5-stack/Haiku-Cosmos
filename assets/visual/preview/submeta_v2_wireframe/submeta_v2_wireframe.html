<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SUB-META v2 Composition v0.3 Preview</title>
  <link rel="stylesheet" href="submeta_v2_wireframe.css" />
</head>
<body>
  <header class="toolbar">
    <h1>SUB-META v2 — Composition v0.3 (organic cockpit)</h1>
    <div class="mode-switch" role="group" aria-label="Tryb widoku">
      <button data-mode="desktop" class="is-active">Desktop</button>
      <button data-mode="tablet">Tablet</button>
      <button data-mode="mobile">Mobile</button>
    </div>
  </header>

  <main id="wireframeRoot" class="mode-desktop">
    <section class="legend panel">
      <h2>Composition v0.3 legend</h2>
      <ul>
        <li><span class="swatch core"></span> resonance core geometry (R4/R3/R2/DS)</li>
        <li><span class="swatch wing"></span> PRG / ŚWIAT cockpit wings</li>
        <li><span class="swatch connector"></span> mini connectors / unlockable placeholders</li>
        <li><span class="swatch layer"></span> future UX/visual layer (non-runtime)</li>
      </ul>
    </section>

    <section class="cockpit panel" id="cockpitLayout"></section>
    <section class="mobile-workspace panel" id="mobileWorkspace"></section>
  </main>

  <script src="submeta_v2_wireframe.js"></script>
</body>
</html>
