name: Deploy Haiku Cosmos to GitHub Pages

on:
  push:
    branches: ["HAIKU-COSMOS-DEPLOY-CLEAN"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "haiku-cosmos-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Validate and test
        run: |
          npm run validate:content
          npm run test
      - name: Build Vite project
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Report immutable artifact
        run: |
          node -e "const m=require('./dist/build-meta.json'); console.log({sha:m.sha,buildId:m.id,appPath:m.appPath,assetBase:m.assetBase})"
          echo "artifact files: $(find dist -type f | wc -l)"
          node scripts/verify-runtime-assets.mjs
          node scripts/verify-legacy-runtime-dist.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Vite dist artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
