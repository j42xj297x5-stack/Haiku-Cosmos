<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Haiku Cosmos</title>

  <style>
    :root {
      --hc-font-ui: "Noto Sans", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --hc-font-display: "Cinzel", "Noto Serif", Georgia, serif;
      --hc-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --hc-ui-direction: ltr;
      --hud-asset-scale: 0.5;
      --hud-native-height: 130px;
      --hud-height: calc(var(--hud-native-height) * var(--hud-asset-scale));
      --hud-safe-margin: 18px;
    }

    html, body {
      font-family: var(--hc-font-ui);
      direction: var(--hc-ui-direction);
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      z-index: 1;
      pointer-events: auto;
    }

    #uiRoot {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #topBar {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: visible;
    }

    #hudTopStage {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1536px;
      height: 234px;
      transform-origin: top center;
      pointer-events: none;
      will-change: transform;
    }

    #hudTopImage {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #btnSubMeta {
      position: absolute;
      left: 768px;
      top: 96px;
      width: 120px;
      height: 120px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: transparent;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      appearance: none;
      -webkit-appearance: none;
    }

    #btnSubMeta:focus-visible {
      outline: 2px solid rgba(255, 214, 122, 0.88);
      outline-offset: 3px;
    }

    #scoreLabel {
      position: absolute;
      left: 1320px;
      top: 95px;
      min-width: 1ch;
      pointer-events: none;
      color: #f6c86a;
      text-shadow: 0 0 8px rgba(255, 184, 76, 0.45), 0 1px 2px rgba(0,0,0,0.75);
      font: 700 28px/1 var(--hc-font-display);
      letter-spacing: 1px;
      white-space: nowrap;
      transform: translateY(-50%);
    }

    #debugHudControls {
      position: fixed;
      left: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: min(420px, calc(100vw - 24px));
      pointer-events: none;
      z-index: 9998;
    }

    .pill {
      pointer-events: auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
      font: 12px/1.2 var(--hc-font-ui);
      backdrop-filter: blur(8px);
    }

    button.pill {
      cursor: pointer;
    }

    #fpsLabel {
      opacity: 0.85;
    }

    #startOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      z-index: 10000;
      pointer-events: auto;
    }
    #startOverlay[hidden] { display: none; }
    .start-panel {
      width: min(420px, 92vw);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(20,20,24,0.92);
      color: #fff;
      font: 14px/1.4 var(--hc-font-ui);
      display: grid;
      gap: 12px;
    }
    .start-actions { display: grid; gap: 10px; }
    .start-actions button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
    }
    .debug-config-panel {
      border-top: 1px solid rgba(255,255,255,0.16);
      padding-top: 10px;
      display: grid;
      gap: 10px;
    }
    .debug-config-panel[hidden] { display: none; }
    .debug-config-grid {
      display: grid;
      gap: 8px;
      max-height: 44vh;
      overflow: auto;
      padding-right: 6px;
    }
    .cfg-section {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      padding: 8px 24px 8px 8px;
      display: grid;
      gap: 6px;
      background: rgba(255,255,255,0.03);
    }
    .cfg-section h3 {
      margin: 0;
      font-size: 13px;
      opacity: 0.9;
    }
    .cfg-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .cfg-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 6px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(0,0,0,0.35);
      color: #fff;
    }
    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .debug-badge { opacity: 0.7; }

    #runtimeDebugOverlay {
      position: fixed;
      left: 12px;
      bottom: calc(52px + env(safe-area-inset-bottom, 0px));
      color: rgba(245,247,255,0.95);
      font: 11px/1.4 var(--hc-font-mono);
      z-index: 11000;
      pointer-events: none;
    }
    #runtimeDebugOverlayPanel {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: min(360px, 42vw);
      max-height: 62vh;
      overflow: auto;
      scrollbar-gutter: stable;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(8, 10, 18, 0.74);
      pointer-events: auto;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      padding: 8px 24px 8px 8px;
      display: grid;
      gap: 8px;
    }
    #runtimeDebugOverlay[hidden] { display: none; }
    .overlay-header { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
    .overlay-header-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .overlay-header .overlay-title { font-weight: 700; letter-spacing: 0.02em; }
    .overlay-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .overlay-btn {
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 3px 7px;
      cursor: pointer;
      font-size: 11px;
    }
    .overlay-grid {
      display: grid;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }
    .overlay-checkbox-row {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 2px 0;
    }
    .overlay-checkbox {
      margin: 0;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .overlay-checkbox-label {
      cursor: pointer;
      user-select: none;
    }
    .overlay-select-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 24px;
    }
    .overlay-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2px;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }
    .overlay-row .k { opacity: 0.75; }
    .overlay-row .v {
      min-width: 0;
      max-width: 100%;
      color: inherit;
      font: inherit;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .overlay-section {
      min-width: 0;
      max-width: 100%;
      border-top: 1px solid rgba(255,255,255,0.14);
      padding-top: 6px;
      display: grid;
      gap: 4px;
    }
    .overlay-collapsible > summary {
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 0.02em;
    }
    .overlay-section h4 {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
      letter-spacing: 0.02em;
    }
    .hud-top-debug-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 8px;
      align-items: center;
    }
    .hud-top-debug-row input,
    .hud-top-debug-row select {
      width: 100%;
      box-sizing: border-box;
    }
    .hud-top-debug-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .hud-top-json {
      min-height: 180px;
      user-select: text;
      touch-action: auto;
    }

    #runtimeDebugOverlay.compact #runtimeDebugOverlayPanel .overlay-expanded-only { display: none; }
    #runtimeDebugOverlay.collapsed #runtimeDebugOverlayPanel {
      display: none;
    }
    .overlay-debug-handle {
      pointer-events: auto;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 3px 8px;
      background: rgba(8, 10, 18, 0.72);
    }
    .overlay-tail {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 3px;
      max-height: 110px;
      overflow: auto;
    }
    .overlay-tail li { opacity: 0.82; min-width: max-content; white-space: nowrap; }
    .overlay-note {
      width: 100%;
      min-height: 54px;
      box-sizing: border-box;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.25);
      color: #fff;
      padding: 6px;
      font: 11px/1.35 var(--hc-font-mono);
      resize: vertical;
    }

    #subMetaPngOverlay {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.74);
      pointer-events: none;
    }
    #subMetaPngOverlay[hidden] { display: none; }
    html.submeta-png-open:not(.submeta-png-preview) #topBar,
    html.submeta-png-open:not(.submeta-png-preview) #debugHudControls {
      visibility: hidden;
    }
    #subMetaPngStage {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 1536 / 1024;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      flex: none;
      pointer-events: none;
    }
    .submeta-png-element {
      position: absolute;
      display: block;
      max-width: none;
      max-height: none;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .submeta-png-element[hidden] { display: none; }
    .submeta-png-background {
      object-fit: contain;
      object-position: center;
      transform-origin: center center;
    }
    .submeta-png-action {
      pointer-events: auto;
      cursor: pointer;
    }
    .submeta-png-action:focus-visible {
      outline: 3px solid rgba(255, 218, 138, 0.92);
      outline-offset: 4px;
    }
    .submeta-png-debug {
      margin-top: 6px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,0.14);
      display: grid;
      gap: 6px;
    }
    .submeta-png-debug > summary {
      font-size: 11px;
      font-weight: 700;
    }
    .submeta-png-diagnostics {
      display: grid;
      gap: 4px;
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.14);
    }
    .submeta-png-debug-row {
      display: grid;
      grid-template-columns: minmax(76px, 0.8fr) minmax(0, 1.2fr);
      gap: 8px;
      align-items: center;
    }
    .submeta-png-debug-row input,
    .submeta-png-debug-row select {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }
    .submeta-png-debug-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px;
    }
    .submeta-png-debug-actions .overlay-btn:last-child {
      grid-column: 1 / -1;
    }
    .submeta-settings-json,
    .submeta-placeholder-json,
    .submeta-panels-json {
      box-sizing: border-box;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      white-space: pre;
      overflow: auto;
    }
  </style>
  <script>
    window.HC_PUBLIC_BASE_URL = "%BASE_URL%";
  </script>
</head>

<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="uiRoot">
    <div id="topBar">
      <div id="hudTopStage">
        <img id="hudTopImage" width="1658" height="253" alt="" draggable="false">
        <button id="btnSubMeta" type="button" aria-label="Otwórz SUB-META"></button>
        <div id="scoreLabel" role="status" aria-live="polite" aria-label="Punkty Rezonansu: 0">0</div>
      </div>
    </div>
    <div id="debugHudControls">
      <div class="pill debug-badge" id="debugBadge" hidden>DEBUG</div>
      <div class="pill" id="fpsLabel">FPS: --</div>
      <button class="pill" id="btnRestart" type="button">Restart</button>
    </div>
    <aside id="runtimeDebugOverlay" hidden class="compact" aria-live="polite">
      <button id="btnDebugOverlayToggle" class="overlay-btn overlay-debug-handle" type="button" title="Hide debug overlay" aria-label="Hide debug overlay" aria-expanded="true">DEBUG ▾</button>
      <div id="runtimeDebugOverlayPanel">
      <div class="overlay-header">
        <span class="overlay-title" data-debug-i18n="overlay.runtimeDebug">Runtime Debug</span>
        <div class="overlay-actions">
          <button id="btnDebugSelectFolder" class="overlay-btn" type="button">Select Log Folder</button>
          <button id="btnDebugFinalizeSession" class="overlay-btn" type="button">End Debug Session</button>
          <button id="btnDebugCopyPath" class="overlay-btn" type="button">Copy Path</button>
          <button id="btnExportEvidence" class="overlay-btn" type="button" data-debug-i18n="overlay.exportEvidence">Export evidence</button>
          <button id="btnMarkIssue" class="overlay-btn" type="button" data-debug-i18n="overlay.markIssue">Mark issue</button>
          </div>
      </div>
      <textarea id="debugSessionNote" class="overlay-note" data-debug-i18n-placeholder="overlay.notePlaceholder" placeholder="Session note (optional)"></textarea>
      <div id="runtimeDebugOverlayBody" class="overlay-grid"></div>
      </div>
    </aside>
  </div>

  <div id="startOverlay">
    <div class="start-panel">
      <h2 style="margin:0; font-size:20px;">Haiku Cosmos</h2>
      <div data-debug-i18n="start.chooseMode">Choose mode for this session.</div>
      <div class="start-actions">
        <button id="btnStartNormal" type="button" data-debug-i18n="start.normalGame">Normal Game</button>
        <button id="btnStartDebug" type="button" data-debug-i18n="start.debugMode">Debug Mode</button>
      </div>
      <div id="debugConfigPanel" class="debug-config-panel" hidden>
        <div class="debug-config-grid">
          <section class="cfg-section">
            <h3 data-debug-i18n="cfg.scenario">Scenario</h3>
            <label class="cfg-row"><span data-debug-i18n="cfg.scenarioPreset">Preset</span><select id="cfgScenarioPreset"></select></label>
            <label class="cfg-row"><span data-debug-i18n="cfg.customScenarioLabel">Custom label</span><input id="cfgScenarioLabel" type="text" maxlength="80" placeholder="optional custom label"></label>
          </section>
          <section class="cfg-section">
            <h3>A. Startowe RP</h3>
            <label class="cfg-row"><span>Startowe RP</span><input id="cfgInitialRP" type="number" min="0" step="1" value="0"></label>
          </section>
          <section class="cfg-section">
            <h3>B. Startowe karty</h3>
            <label class="cfg-row"><span>R1 Red (DR)</span><input id="cfgCardR1RedDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Yellow (DR)</span><input id="cfgCardR1YellowDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Green (DR)</span><input id="cfgCardR1GreenDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Blue (DR)</span><input id="cfgCardR1BlueDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>DS Red (DR)</span><input id="cfgCardDSRedDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>DS Yellow (DR)</span><input id="cfgCardDSYellowDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>DS Green (DR)</span><input id="cfgCardDSGreenDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>DS Blue (DR)</span><input id="cfgCardDSBlueDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Red (sDR)</span><input id="cfgCardR1RedSDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Red (pDR)</span><input id="cfgCardR1RedPDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Yellow (sDR)</span><input id="cfgCardR1YellowSDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Yellow (pDR)</span><input id="cfgCardR1YellowPDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Green (sDR)</span><input id="cfgCardR1GreenSDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Green (pDR)</span><input id="cfgCardR1GreenPDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Blue (sDR)</span><input id="cfgCardR1BlueSDR" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>R1 Blue (pDR)</span><input id="cfgCardR1BluePDR" type="number" min="0" step="1" value="0"></label>
          </section>
          <section class="cfg-section">
            <h3>C. Startowy stan świata</h3>
            <label class="cfg-row"><span>Asteroids</span><input id="cfgAsteroidCount" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>Rocky Planets</span><input id="cfgRockyPlanetCount" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>Gas Planets</span><input id="cfgGasPlanetCount" type="number" min="0" step="1" value="0"></label>
            <label class="cfg-row"><span>Stars</span><input id="cfgStarCount" type="number" min="0" step="1" value="0"></label>
          </section>
          <section class="cfg-section">
            <h3>D. Override progów</h3>
            <label class="cfg-row"><span>Asteroid → Planet</span><input id="cfgThresholdAsteroidToPlanet" type="number" min="0" step="1" placeholder="default"></label>
            <label class="cfg-row"><span>Planet → Star</span><input id="cfgThresholdPlanetToStar" type="number" min="0" step="1" placeholder="default"></label>
          </section>
        </div>
        <div class="secondary-actions">
          <button id="btnDebugBack" type="button" data-debug-i18n="common.back">Back</button>
          <button id="btnDebugResetDefaults" type="button" data-debug-i18n="common.resetDefaults">Reset to defaults</button>
        </div>
        <button id="btnStartDebugSession" type="button" data-debug-i18n="start.startDebugSession">Start Debug Session</button>
      </div>
    </div>
  </div>

  <!-- Source of truth documentation is in docs/current/ (see docs/current/README.md). -->

  <script src="runtime/hc.public_path.js"></script>
  <script src="runtime/hc.submeta_settings.js"></script>
  <script src="runtime/hc.debug.js"></script>
  <script src="runtime/hc.visual_assets.js"></script>
  <script src="runtime/hc.frame_composer.js"></script>
  <script src="runtime/hc.card_visuals.js"></script>
  <script src="runtime/hc.submeta_layout.js"></script>
  <script src="runtime/hc.submeta_png.js"></script>
  <script src="runtime/hc.submeta_placeholders.js"></script>
  <script src="runtime/hc.submeta_panels.js"></script>
  <script src="runtime/hc.prg_frame_probe.js"></script>
  <script src="runtime/cards.js"></script>
  <script src="runtime/hc.hud_v2.js"></script>
  <script src="runtime/hc.hud_top_layout.js"></script>

  <script src="runtime/hc.core.js"></script>
  <script src="runtime/hc.util.js"></script>
  <script src="runtime/hc.world.js"></script>
  <script src="runtime/hc.view_input.js"></script>
  <script src="runtime/hc.camera.js"></script>
  <script src="runtime/hc.comets.js"></script>
  <script src="runtime/hc.meteors.js"></script>
  <script src="runtime/hc.render.js"></script>
  <script src="runtime/hc.collisions.js"></script>
  <script src="runtime/hc.asteroids.js"></script>
  <script src="runtime/hc.planets.js"></script>
  <script src="runtime/hc.stars_epoch.js"></script>
  <script src="runtime/hc.world_render_snapshot.js"></script>
  <script type="module" src="./hc.three_module_bridge.js"></script>

  <script src="runtime/hc.world_renderer.js"></script>
  <script src="runtime/hc.ui_debug.js"></script>

  <script src="runtime/game.boot.js"></script>

  <noscript>
    <div style="color:#fff; padding:16px; font-family:system-ui;">
      Ta gra wymaga włączonego JavaScript.
    </div>
  </noscript>
</body>
</html>
